services:
  - type: web
    name: flyrank-capstone-socialstudio
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:combined
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: socialstudio-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: socialstudio-redis
          property: connectionString
      # Secrets — set once in the Render Dashboard after the first deploy,
      # never committed to this file. See README for how to generate them.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: FAKE_PLATFORM_PORT
        value: 4000

  - type: keyvalue
    name: socialstudio-redis
    plan: free
    # noeviction, not the default allkeys-lru — this Redis holds BullMQ job
    # data, not a cache. LRU eviction under memory pressure would silently
    # drop scheduled jobs, undermining the crash-recovery guarantee.
    maxmemoryPolicy: noeviction
    # No public internet access needed — only our own web service talks
    # to this, over Render's private network via the fromService URL above.
    ipAllowList: []

databases:
  - name: socialstudio-db
    plan: free
